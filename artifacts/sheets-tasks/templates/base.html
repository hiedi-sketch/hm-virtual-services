<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Task Manager{% endblock %} — Sheet Sync</title>

  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #111827; font-size: 13px; }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      background: #fff; border-bottom: 1px solid #e5e7eb;
      padding: 10px 24px; position: sticky; top: 0; z-index: 200;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .logo { font-size: 16px; font-weight: 700; color: #188038; display: flex; align-items: center; gap: 8px; }
    .logo svg { width: 20px; height: 20px; }
    .topbar .spacer { flex: 1; }
    .sync-status { font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; display: inline-block; flex-shrink:0; }
    .sync-dot.ok { background: #22c55e; }
    .sync-dot.error { background: #ef4444; }
    .sync-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* Buttons */
    .btn {
      padding: 6px 14px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff;
      cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center;
      gap: 5px; transition: background .12s, box-shadow .12s; color: #374151; white-space: nowrap;
    }
    .btn:hover { background: #f9fafb; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .btn.primary { background: #188038; color: #fff; border-color: #188038; }
    .btn.primary:hover { background: #146c2e; }

    /* Layout */
    .container { max-width: 1440px; margin: 0 auto; padding: 20px 24px; }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar h1 { font-size: 18px; font-weight: 700; flex: 1 1 auto; }
    .filter-select {
      padding: 5px 10px; border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; font: inherit; font-size: 12px; color: #374151; cursor: pointer;
    }
    .filter-select:focus { outline: 2px solid #188038; border-color: #188038; }

    /* Alerts */
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; display: flex; gap: 10px; }
    .alert.warn { background: #fffbeb; border: 1px solid #fbbf24; color: #92400e; }
    .alert.info { background: #eff6ff; border: 1px solid #93c5fd; color: #1e40af; }
    .alert code { font-family: monospace; background: rgba(0,0,0,.08); padding: 1px 5px; border-radius: 3px; font-size: 12px; }

    /* Add form */
    .add-form {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 18px 20px; margin-bottom: 14px;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
    }
    .add-form.hidden { display: none !important; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .4px; }
    .form-group input, .form-group select {
      width: 100%; border: 1px solid #d1d5db; border-radius: 5px;
      padding: 6px 9px; font: inherit; font-size: 13px; color: #111827;
    }
    .form-group input:focus, .form-group select:focus { outline: 2px solid #188038; border-color: #188038; }
    .form-actions { grid-column: 1/-1; display: flex; gap: 8px; justify-content: flex-end; }

    /* Google Sheets-style table */
    .table-wrap { background: #fff; border: 1px solid #c0c0c0; border-radius: 0; overflow: hidden; }
    table.dataTable { border-collapse: collapse; width: 100% !important; font-size: 13px; font-family: Arial, sans-serif; }

    /* Column headers — grey bar like Sheets */
    table.dataTable thead th {
      background: #f3f3f3;
      color: #333;
      font-weight: 600;
      font-size: 12px;
      border: 1px solid #d0d0d0;
      border-bottom: 2px solid #c0c0c0;
      padding: 5px 8px;
      white-space: nowrap;
      text-align: left;
      user-select: none;
    }
    table.dataTable thead th:hover { background: #e8e8e8; }

    /* Row number header cell */
    table.dataTable thead th:first-child {
      background: #f3f3f3; color: #888; text-align: center;
      width: 42px; min-width: 42px; font-size: 11px; font-weight: 400;
    }

    /* Data cells */
    table.dataTable tbody td {
      border: 1px solid #e0e0e0;
      padding: 4px 8px;
      vertical-align: middle;
      color: #1f1f1f;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #fff;
    }

    /* Row number cells */
    table.dataTable tbody td:first-child {
      background: #f8f8f8 !important;
      color: #999;
      text-align: center;
      font-size: 11px;
      border-right: 1px solid #c0c0c0;
      width: 42px;
      min-width: 42px;
      user-select: none;
    }

    /* Hover — Google Sheets light blue selection */
    table.dataTable tbody tr:hover td { background: #e8f0fe !important; }
    table.dataTable tbody tr:hover td:first-child { background: #d2e3fc !important; }

    /* Completed rows */
    table.dataTable tbody tr.completed td { background: #e6f4ea !important; }
    table.dataTable tbody tr.completed td:first-child { background: #d4edda !important; }
    table.dataTable tbody tr.completed td .task-link { text-decoration: line-through; color: #5f6368; }

    /* Overdue rows */
    table.dataTable tbody tr.overdue td { background: #fce8e6 !important; }
    table.dataTable tbody tr.overdue td:first-child { background: #f5c6c2 !important; }
    table.dataTable tbody tr.overdue td .task-link { color: #c5221f; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge.pending   { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .badge.progress  { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .badge.completed { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge.overdue   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    /* Action buttons */
    .action-btn {
      background: none; border: none; cursor: pointer; padding: 3px 7px;
      border-radius: 4px; color: #9ca3af; font-size: 14px; line-height: 1;
      transition: background .1s, color .1s;
    }
    .action-btn:hover       { background: #f3f4f6; color: #111827; }
    .action-btn.del:hover   { background: #fee2e2; color: #dc2626; }
    .action-btn.complete:hover { background: #dcfce7; color: #166534; }

    /* Task & client links */
    .task-link   { cursor: pointer; font-weight: 500; }
    .task-link:hover { text-decoration: underline; }
    .client-link { color: #2563eb; text-decoration: none; }
    .client-link:hover { text-decoration: underline; }

    /* DataTables chrome */
    .dataTables_wrapper .dataTables_filter input {
      border: 1px solid #d1d5db; border-radius: 5px; padding: 5px 9px; font-size: 13px; margin-left: 6px;
    }
    .dataTables_wrapper .dataTables_filter input:focus { outline: 2px solid #188038; }
    .dataTables_wrapper .dataTables_length select { border: 1px solid #d1d5db; border-radius: 5px; padding: 4px 6px; font-size: 13px; }
    .dt-top { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; }
    .dt-bottom { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-top: 1px solid #e5e7eb; }
    .dataTables_info { font-size: 12px; color: #6b7280; }
    .dataTables_paginate .paginate_button { padding: 3px 9px !important; border-radius: 5px !important; font-size: 13px !important; }
    .dataTables_paginate .paginate_button.current { background: #188038 !important; color: #fff !important; border-color: #188038 !important; }
    .dataTables_paginate .paginate_button:hover { background: #f3f4f6 !important; color: #111827 !important; border-color: #d1d5db !important; }

    /* Timer widget */
    .timer-widget {
      position: fixed; bottom: 24px; right: 24px;
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      padding: 14px 18px; box-shadow: 0 4px 24px rgba(0,0,0,.12);
      min-width: 210px; z-index: 300;
    }
    .timer-widget h4 { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .timer-task-label { font-size: 11px; color: #374151; margin-bottom: 6px; min-height: 16px; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 174px; }
    .timer-display { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: #188038; letter-spacing: 2px; }
    .timer-btns { display: flex; gap: 6px; margin-top: 10px; }
    .timer-btns button { flex: 1; padding: 6px 4px; border-radius: 6px; font-size: 12px; font-weight: 600; border: none; cursor: pointer; }
    #timerStart  { background: #188038; color: #fff; }
    #timerStart:hover { background: #146c2e; }
    #timerPause  { background: #fbbf24; color: #111827; }
    #timerPause:hover { background: #f59e0b; }
    #timerStop   { background: #ef4444; color: #fff; }
    #timerStop:hover  { background: #dc2626; }

    /* Edit modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 500; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 10px; padding: 26px 28px; width: 520px; max-width: 95vw; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
    .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
    .modal .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal .full { grid-column: 1/-1; }
    .modal .form-group label { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; }
    .modal .form-group input, .modal .form-group select, .modal .form-group textarea {
      width: 100%; border: 1px solid #d1d5db; border-radius: 5px; padding: 7px 10px; font: inherit; font-size: 13px;
    }
    .modal .form-group input:focus, .modal .form-group select:focus { outline: 2px solid #188038; border-color: #188038; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    @media (max-width: 640px) {
      .topbar { padding: 8px 12px; }
      .container { padding: 12px; }
      .timer-widget { bottom: 12px; right: 12px; min-width: 180px; }
    }
  </style>
</head>
<body>

<script>
const BASE_PATH = '{{ base_path }}';
</script>

<div class="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="3" y="3" width="18" height="18" rx="2" fill="#34a853" opacity=".15"/>
      <rect x="3" y="3" width="18" height="18" rx="2" stroke="#188038" stroke-width="1.5"/>
      <line x1="3" y1="8"  x2="21" y2="8"  stroke="#188038" stroke-width="1"/>
      <line x1="3" y1="13" x2="21" y2="13" stroke="#188038" stroke-width="1"/>
      <line x1="9" y1="3"  x2="9"  y2="21" stroke="#188038" stroke-width="1"/>
    </svg>
    Sheet Task Manager
  </div>
  <div class="spacer"></div>
  <div class="sync-status">
    <span class="sync-dot" style="background:#9ca3af"></span>
    <span style="color:#6b7280">Sheets: Offline</span>
  </div>
</div>

<div class="container">
  {% block content %}{% endblock %}
</div>

<!-- Floating timer -->
<div class="timer-widget">
  <h4>⏱ Timer</h4>
  <div class="timer-task-label" id="timerTaskLabel">No task selected</div>
  <div class="timer-display" id="timerDisplay">00:00:00</div>
  <div class="timer-btns">
    <button id="timerStart" onclick="startTimer()">▶ Start</button>
    <button id="timerPause" onclick="pauseTimer()" style="display:none">⏸ Pause</button>
    <button id="timerStop"  onclick="stopTimer()">■ Stop</button>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>Edit Task</h2>
    <div class="form-grid">
      <div class="form-group full">
        <label>Task Description</label>
        <input type="text" id="editName">
      </div>
      <div class="form-group">
        <label>Client</label>
        <input type="text" id="editClient">
      </div>
      <div class="form-group">
        <label>Service Type</label>
        <select id="editService">
          <option value="">—</option>
          <option>Bookkeeping</option>
          <option>Virtual Assistant</option>
        </select>
      </div>
      <div class="form-group">
        <label>Frequency</label>
        <select id="editFrequency">
          <option value="">—</option>
          <option>Daily</option>
          <option>Weekly</option>
          <option>Monthly</option>
          <option>One-Time</option>
        </select>
      </div>
      <div class="form-group">
        <label>Day / Detail</label>
        <input type="text" id="editDaySpec">
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="editDue">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="editStatus">
          <option>Not Started</option>
          <option>In Progress</option>
          <option>Completed</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeEditModal()">Cancel</button>
      <button class="btn primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<script>
let editingId = null;


function rowClass(d) {
  if (d.status === 'Completed') return 'completed';
  const today = new Date().toISOString().slice(0,10);
  if (d.due_date && d.due_date < today) return 'overdue';
  return '';
}

function badgeHtml(status) {
  const map = { 'Not Started':'pending', 'In Progress':'progress', Completed:'completed' };
  return `<span class="badge ${map[status]||'pending'}">${status||'Not Started'}</span>`;
}

async function triggerTaskProcessing(taskId) {
  try {
    console.log("Triggering webhook for taskId:", taskId);
    const response = await fetch("https://script.google.com/macros/s/AKfycbypfsBkNWTnNoUhLy_nDahx6je7kPNatXbCRv0Qujyd2AfRyfk7EB-29EbZrb7DX31lKw/exec", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        taskId: taskId
      })
    });
    const result = await response.json();
    console.log("Webhook response:", result);
  } catch (error) {
    console.error("Webhook error:", error);
  }
}

async function completeTask(id) {
  const resp = await fetch(BASE_PATH + 'api/tasks/' + id, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status:'Completed'})
  });
  const task = await resp.json();
  console.log("Task marked Completed:", task);
  await triggerTaskProcessing(task.id);
  if (window._taskTable) window._taskTable.ajax.reload(null, false);
}

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  await fetch(BASE_PATH + 'api/tasks/' + id, { method:'DELETE' });
  if (window._taskTable) window._taskTable.ajax.reload(null, false);
}

function openEditModal(task) {
  editingId = task.id;
  document.getElementById('editName').value      = task.task_name || '';
  document.getElementById('editClient').value    = task.client   || '';
  document.getElementById('editService').value   = task.service_type || '';
  document.getElementById('editFrequency').value = task.frequency   || '';
  document.getElementById('editDaySpec').value   = task.day_spec    || '';
  document.getElementById('editDue').value       = task.due_date    || '';
  document.getElementById('editStatus').value    = task.status      || 'Not Started';
  document.getElementById('editModal').classList.add('open');
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('open');
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;
  await fetch(BASE_PATH + 'api/tasks/' + editingId, {
    method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      task_name:    document.getElementById('editName').value,
      client:       document.getElementById('editClient').value,
      service_type: document.getElementById('editService').value || null,
      frequency:    document.getElementById('editFrequency').value,
      day_spec:  document.getElementById('editDaySpec').value,
      due_date:  document.getElementById('editDue').value || null,
      status:    document.getElementById('editStatus').value,
    }),
  });
  closeEditModal();
  if (window._taskTable) window._taskTable.ajax.reload(null, false);
}

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeEditModal();
});

let _timerInterval = null, _timerSec = 0, _timerRunning = false;

function fmtTime(s) {
  return [Math.floor(s/3600), Math.floor((s%3600)/60), s%60]
    .map(n => String(n).padStart(2,'0')).join(':');
}

function startTimer(taskName) {
  if (taskName) {
    document.getElementById('timerTaskLabel').textContent = taskName;
  }
  _timerRunning = true;
  _timerInterval = setInterval(() => {
    _timerSec++;
    document.getElementById('timerDisplay').textContent = fmtTime(_timerSec);
  }, 1000);
  document.getElementById('timerStart').style.display = 'none';
  document.getElementById('timerPause').style.display = '';
}

function pauseTimer() {
  clearInterval(_timerInterval); _timerRunning = false;
  document.getElementById('timerPause').style.display = 'none';
  document.getElementById('timerStart').style.display = '';
  document.getElementById('timerStart').textContent = '▶ Resume';
}

function stopTimer() {
  clearInterval(_timerInterval); _timerRunning = false; _timerSec = 0;
  document.getElementById('timerDisplay').textContent = '00:00:00';
  document.getElementById('timerTaskLabel').textContent = 'No task selected';
  document.getElementById('timerPause').style.display = 'none';
  document.getElementById('timerStart').style.display = '';
  document.getElementById('timerStart').textContent = '▶ Start';
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
