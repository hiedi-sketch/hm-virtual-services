{% extends "base.html" %}
{% block title %}{{ client_name }}{% endblock %}

{% block content %}
<div class="toolbar">
  <h1>
    <a href="{{ base_path }}" style="color:#666;text-decoration:none;font-weight:400">All Tasks</a>
    <span style="margin:0 8px;color:#ccc">/</span>
    {{ client_name }}
  </h1>
  <button class="btn primary" onclick="toggleAddForm()">+ New Task</button>
</div>

<div class="alert info">
  📋 Tasks assigned to <strong>{{ client_name }}</strong>.
</div>

<div class="add-form hidden" id="addForm">
  <div class="form-group">
    <label>Task Description *</label>
    <input type="text" id="newName" placeholder="e.g. Import Transactions">
  </div>
  <div class="form-group">
    <label>Service Type</label>
    <select id="newService">
      <option value="">—</option>
      <option>Bookkeeping</option>
      <option>Virtual Assistant</option>
    </select>
  </div>
  <div class="form-group">
    <label>Frequency</label>
    <select id="newFrequency">
      <option value="">—</option>
      <option>Daily</option>
      <option>Weekly</option>
      <option>Monthly</option>
      <option>One-Time</option>
    </select>
  </div>
  <div class="form-group">
    <label>Day / Detail</label>
    <input type="text" id="newDaySpec" placeholder="e.g. Tuesday">
  </div>
  <div class="form-group">
    <label>Due Date</label>
    <input type="date" id="newDue">
  </div>
  <div class="form-group">
    <label>Status</label>
    <select id="newStatus">
      <option>Not Started</option>
      <option>In Progress</option>
      <option>Completed</option>
    </select>
  </div>
  <div class="form-actions">
    <button class="btn" onclick="toggleAddForm()">Cancel</button>
    <button class="btn primary" onclick="addTask()">Add Task</button>
  </div>
</div>

<div class="table-wrap">
  <table id="taskTable" class="dataTable" style="width:100%">
    <thead>
      <tr>
        <th>#</th>
        <th>Task Description</th>
        <th>Service Type</th>
        <th>Frequency</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
const CLIENT_NAME = {{ client_name | tojson }};

function toggleAddForm() {
  document.getElementById('addForm').classList.toggle('hidden');
}

async function addTask() {
  const name = document.getElementById('newName').value.trim();
  if (!name) { alert('Task Description is required.'); return; }
  await fetch(BASE_PATH + 'api/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      task_name:    name,
      client:       CLIENT_NAME,
      service_type: document.getElementById('newService').value || null,
      frequency:    document.getElementById('newFrequency').value || null,
      day_spec:     document.getElementById('newDaySpec').value || null,
      due_date:     document.getElementById('newDue').value || null,
      status:       document.getElementById('newStatus').value,
    }),
  });
  document.getElementById('newName').value = '';
  document.getElementById('newDaySpec').value = '';
  document.getElementById('newDue').value = '';
  window._taskTable.ajax.reload(null, false);
}

function fmtFreq(freq, day) {
  if (!freq) return '';
  return day ? `${freq} · <span style="color:#666;font-size:11px">${day}</span>` : freq;
}

$(function() {
  window._taskTable = $('#taskTable').DataTable({
    ajax: { url: BASE_PATH + `api/tasks?client=${encodeURIComponent(CLIENT_NAME)}`, dataSrc: '' },
    order: [[3,'asc']],
    pageLength: 25,
    dom: '<"dt-top"lf>t<"dt-bottom"ip>',
    columns: [
      {
        data: null, orderable: false, searchable: false,
        render: (d, t, r, m) => m.settings._iDisplayStart + m.row + 1
      },
      {
        data: 'task_name',
        render: (d, t, row) => t==='display'
          ? `<span class="task-link" onclick="startTimer('${d.replace(/'/g,"\\'")}')">▶ ${d}</span>`
          : d
      },
      { data: 'service_type', defaultContent: '' },
      {
        data: null, defaultContent: '',
        render: (d,t) => t==='display' ? fmtFreq(d.frequency, d.day_spec) : (d.frequency||'')
      },
      { data: 'due_date', defaultContent: '', render: (d,t) => t==='display' ? (d||'—') : (d||'') },
      { data: 'status',   render: (d, t) => t==='display' ? badgeHtml(d) : d },
      {
        data: null, orderable: false, searchable: false,
        render: d => `
          <button class="action-btn complete" title="Mark Completed" onclick="completeTask(${d.id})">✓</button>
          <button class="action-btn" title="Edit" onclick='openEditModal(${JSON.stringify(d)})'>✎</button>
          <button class="action-btn del" title="Delete" onclick="deleteTask(${d.id})">✕</button>
        `
      },
    ],
    createdRow: (row, data) => {
      const cls = rowClass(data);
      if (cls) $(row).addClass(cls);
    },
  });
});
</script>
{% endblock %}
