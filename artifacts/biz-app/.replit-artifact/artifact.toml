kind = "web"
previewPath = "/"
title = "Business Manager"
version = "1.0.0"
id = "artifacts/biz-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21931

[services.development]
run = "pnpm --filter @workspace/biz-app run dev"

[services.production]
build = "pnpm --filter @workspace/biz-app --filter @workspace/api-server run build"
run = "node --enable-source-maps artifacts/api-server/dist/index.mjs"

[services.env]
PORT = "21931"
BASE_PATH = "/"
