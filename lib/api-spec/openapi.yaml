openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Business Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client management
  - name: tasks
    description: Task management
  - name: time
    description: Time tracking
  - name: leads
    description: CRM leads
  - name: invoices
    description: Invoice tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client information
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientInput"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [clients]
      summary: Get dashboard data with client hour summaries
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientDashboard"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/spawn-recurring:
    post:
      operationId: spawnRecurringTasks
      tags: [tasks]
      summary: Check and spawn new tasks for any recurring tasks that are due
      responses:
        "200":
          description: List of newly spawned tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

  /tasks/{taskId}/subtasks:
    get:
      operationId: listSubtasks
      tags: [tasks]
      summary: List subtasks for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subtasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subtask"
    post:
      operationId: createSubtask
      tags: [tasks]
      summary: Add a subtask to a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubtaskInput"
      responses:
        "201":
          description: Created subtask
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subtask"

  /subtasks/{id}:
    patch:
      operationId: updateSubtask
      tags: [tasks]
      summary: Update a subtask (toggle done, rename)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubtaskInput"
      responses:
        "200":
          description: Updated subtask
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subtask"
    delete:
      operationId: deleteSubtask
      tags: [tasks]
      summary: Delete a subtask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task (e.g. mark complete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /time:
    get:
      operationId: listTimeEntries
      tags: [time]
      summary: List time entries
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
    post:
      operationId: createTimeEntry
      tags: [time]
      summary: Log a time entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeEntryInput"
      responses:
        "201":
          description: Created time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List all invoices
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create a new invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvoiceInput"
      responses:
        "201":
          description: Created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  /invoices/{id}:
    patch:
      operationId: updateInvoice
      tags: [invoices]
      summary: Update an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInvoiceInput"
      responses:
        "200":
          description: Updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
    delete:
      operationId: deleteInvoice
      tags: [invoices]
      summary: Delete an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        monthly_hour_budget:
          type: number
        monthly_fee:
          type: number
        service_type:
          type: string
          enum: [bookkeeping, va, hybrid]
      required:
        - id
        - name
        - email
        - monthly_hour_budget
        - monthly_fee
        - service_type

    CreateClientInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        monthly_hour_budget:
          type: number
        monthly_fee:
          type: number
        service_type:
          type: string
          enum: [bookkeeping, va, hybrid]
      required:
        - name
        - email
        - monthly_hour_budget
        - monthly_fee
        - service_type

    UpdateClientInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        service_type:
          type: string
          enum: [bookkeeping, va, hybrid]

    ClientDashboard:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        monthly_hour_budget:
          type: number
        monthly_fee:
          type: number
        service_type:
          type: string
          enum: [bookkeeping, va, hybrid]
        hours_used_this_month:
          type: number
        hours_remaining:
          type: number
      required:
        - id
        - name
        - email
        - monthly_hour_budget
        - monthly_fee
        - service_type
        - hours_used_this_month
        - hours_remaining

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        client_id:
          type: integer
        assigned_to:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, complete]
        due_date:
          type: string
          nullable: true
        client_name:
          type: string
          nullable: true
        recurrence:
          type: string
          enum: [daily, weekdays, weekly, monthly, annually]
          nullable: true
        last_generated_at:
          type: string
          nullable: true
      required:
        - id
        - title
        - client_id
        - status

    CreateTaskInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        client_id:
          type: integer
        assigned_to:
          type: string
          nullable: true
        due_date:
          type: string
          nullable: true
        recurrence:
          type: string
          enum: [daily, weekdays, weekly, monthly, annually]
          nullable: true
      required:
        - title
        - client_id

    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        assigned_to:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, complete]
        due_date:
          type: string
          nullable: true
        recurrence:
          type: string
          enum: [daily, weekdays, weekly, monthly, annually]
          nullable: true

    TimeEntry:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        task_id:
          type: integer
          nullable: true
        duration_minutes:
          type: integer
        date:
          type: string
        client_name:
          type: string
          nullable: true
        task_title:
          type: string
          nullable: true
      required:
        - id
        - client_id
        - duration_minutes
        - date

    CreateTimeEntryInput:
      type: object
      properties:
        client_id:
          type: integer
        task_id:
          type: integer
          nullable: true
        duration_minutes:
          type: integer
        date:
          type: string
      required:
        - client_id
        - duration_minutes
        - date

    Lead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        estimated_value:
          type: number
          nullable: true
        status:
          type: string
          enum: [new, contacted, closed]
        lead_source:
          type: string
          nullable: true
      required:
        - id
        - name
        - status

    CreateLeadInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        estimated_value:
          type: number
          nullable: true
        status:
          type: string
          enum: [new, contacted, closed]
        lead_source:
          type: string
          nullable: true
      required:
        - name

    UpdateLeadInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          nullable: true
        estimated_value:
          type: number
          nullable: true
        status:
          type: string
          enum: [new, contacted, closed]
        lead_source:
          type: string
          nullable: true

    Subtask:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        title:
          type: string
        done:
          type: boolean
      required:
        - id
        - task_id
        - title
        - done

    CreateSubtaskInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    UpdateSubtaskInput:
      type: object
      properties:
        title:
          type: string
        done:
          type: boolean

    Invoice:
      type: object
      properties:
        id:
          type: integer
        client_id:
          type: integer
        amount:
          type: number
        status:
          type: string
          enum: [paid, unpaid]
        due_date:
          type: string
        description:
          type: string
          nullable: true
      required:
        - id
        - client_id
        - amount
        - status
        - due_date

    CreateInvoiceInput:
      type: object
      properties:
        client_id:
          type: integer
        amount:
          type: number
        status:
          type: string
          enum: [paid, unpaid]
        due_date:
          type: string
        description:
          type: string
          nullable: true
      required:
        - client_id
        - amount
        - due_date

    UpdateInvoiceInput:
      type: object
      properties:
        amount:
          type: number
        status:
          type: string
          enum: [paid, unpaid]
        due_date:
          type: string
        description:
          type: string
          nullable: true
